<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>المحفظة المالية الذكية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
</head>
<body class="bg-slate-100 text-slate-800 antialiased pb-28">

  <!-- الشريط العلوي الثابت -->
  <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <button id="btnSettings" class="p-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 cursor-pointer text-lg">⚙️</button>
        <button id="btnBackup" class="p-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 cursor-pointer text-lg" title="تصدير نسخة احتياطية">💾</button>
      </div>
      <button id="liveFxDisplay" class="bg-indigo-800 hover:bg-indigo-900 border border-indigo-400/30 px-3 py-1 rounded-full text-xs font-mono font-bold tracking-wide cursor-pointer">
        1$ = ... ل.س
      </button>
      <div class="font-bold text-sm tracking-wide">محفظتي الذكية</div>
    </div>
  </header>

  <!-- جسم التطبيق -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- شريط التبديل المزدوج -->
    <div class="bg-slate-200 p-1 rounded-xl flex gap-1">
      <button id="tabWallets" class="flex-1 py-2 text-center font-bold bg-white text-indigo-700 rounded-lg shadow-sm text-sm cursor-pointer">
        💰 المحافظ الواقعية
      </button>
      <button id="tabProjects" class="flex-1 py-2 text-center font-bold text-gray-500 hover:text-gray-700 text-sm cursor-pointer">
        🏢 المشاريع والذمم
      </button>
    </div>

    <!-- قسم المحافظ الواقعية -->
    <div id="walletsSection" class="space-y-3">
      <div id="walletsContainer" class="space-y-2.5"></div>
    </div>

    <!-- قسم المشاريع والديون -->
    <div id="projectsSection" class="space-y-4 hidden">
      <h3 class="text-xs font-bold text-gray-500 mr-1">المشاريع والأنشطة المستقلة</h3>
      <div id="projectsContainer" class="space-y-2.5"></div>

      <h3 class="text-xs font-bold text-gray-500 mr-1 mt-4">سجل الديون والأمانات المعلقة</h3>
      <div id="debtsListContainer" class="space-y-2 bg-white p-3 rounded-xl border border-gray-100"></div>
    </div>

  </main>

  <!-- الزر العائم في الأسفل (FAB) -->
  <div class="fixed bottom-6 inset-x-0 flex justify-center z-30">
    <button id="fabAi" class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold px-6 py-3.5 rounded-full shadow-2xl flex items-center gap-2 hover:scale-105 active:scale-95 transition-all cursor-pointer">
      <span class="text-xl">✨</span>
      <span>مساعد الذكاء المالي</span>
    </button>
  </div>

  <!-- النافذة السفلية المنبثقة (Bottom Sheet) -->
  <div id="aiBottomSheet" class="fixed inset-x-0 bottom-0 bg-white rounded-t-3xl shadow-2xl p-5 border-t border-gray-200 z-50 transform translate-y-full transition-transform duration-300 max-w-md mx-auto">
    <div class="flex justify-between items-center mb-3">
      <span class="text-sm font-bold text-gray-700">تحدث أو اكتب حركتك المالية</span>
      <button id="closeSheet" class="text-gray-400 hover:text-gray-700 text-xl font-bold p-1 cursor-pointer">✕</button>
    </div>

    <div class="relative">
      <textarea id="aiInput" rows="3" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 pl-12 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="مثال: استلمت 500 دولار كاش من العطار لوساطة الشحن، أجور الشحن 100 دولار ومربحي 50 والباقي أمانة للعطار..."></textarea>
      <button id="btnVoice" class="absolute left-3 top-3 text-xl text-gray-400 hover:text-indigo-600 p-1 cursor-pointer" title="تحدث بالصوت">
        🎙️
      </button>
    </div>

    <button id="btnSendAi" class="w-full mt-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-md cursor-pointer">
      إرسال 🚀
    </button>

    <!-- صندوق قرار العملية والملخص -->
    <div id="decisionBox" class="mt-4 p-3.5 bg-indigo-50 border border-indigo-200 rounded-xl space-y-3 hidden">
      <div>
        <span class="text-xs font-bold text-indigo-900">ملخص العملية المقترحة:</span>
        <p id="aiSummaryText" class="text-sm text-indigo-950 font-medium mt-1 leading-relaxed"></p>
      </div>
      <div class="flex gap-2">
        <button id="btnConfirmAction" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm shadow cursor-pointer">
          ✅ موافق وتنفيذ
        </button>
        <button id="btnRejectAction" class="w-24 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-2.5 rounded-lg text-sm border border-rose-200 cursor-pointer">
          تعديل
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
